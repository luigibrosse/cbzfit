name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run test suite with branch coverage
        run: >-
          python -m pytest
          --cov=cbzfit
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100

  package-smoke-test:
    name: Package smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify changelog in source distribution
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar

          source_distributions = list(Path("dist").glob("*.tar.gz"))
          assert len(source_distributions) == 1, source_distributions

          with open_tar(source_distributions[0], mode="r:gz") as archive:
              changelog_paths = [
                  member.name
                  for member in archive.getmembers()
                  if Path(member.name).name == "CHANGELOG.md"
              ]

          assert len(changelog_paths) == 1, changelog_paths
          changelog_parts = Path(changelog_paths[0]).parts
          assert len(changelog_parts) == 2, changelog_parts
          assert changelog_parts[-1] == "CHANGELOG.md"
          PY

      - name: Create clean environment
        run: python -m venv .package-smoke

      - name: Install built wheel
        run: .package-smoke/bin/python -m pip install dist/*.whl

      - name: Verify installed entry points
        run: |
          test "$(.package-smoke/bin/cbzfit --version)" = "cbzfit 0.1.0"
          test "$(.package-smoke/bin/python -m cbzfit --version)" = "cbzfit 0.1.0"

      - name: Process a generated CBZ with installed command
        run: |
          .package-smoke/bin/python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile

          from PIL import Image

          image_stream = BytesIO()
          with Image.new("RGB", (20, 40), "white") as image:
              image.save(image_stream, format="PNG")

          with ZipFile("smoke-source.cbz", mode="w") as archive:
              archive.writestr("001.png", image_stream.getvalue())
          PY
          .package-smoke/bin/cbzfit \
            smoke-source.cbz \
            smoke-output.cbz \
            --screen-width 10 \
            --screen-height 20 \
            --verify crc
          .package-smoke/bin/python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile

          from PIL import Image

          output_path = Path("smoke-output.cbz")
          assert output_path.is_file()

          with ZipFile(output_path, mode="r") as archive:
              assert archive.testzip() is None
              assert archive.namelist() == ["001.png"]
              with Image.open(BytesIO(archive.read("001.png"))) as image:
                  image.load()
                  assert image.format == "PNG"
                  assert image.size == (10, 20)
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: cbzfit-distributions
          path: dist/*
          if-no-files-found: error
