[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cbzfit"
dynamic = ["version"]
description = "Resize manga and comic CBZ archives for e-readers and other displays."
keywords = ["cbz", "manga", "comics", "image-resizing", "e-reader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "luigibrosse" }
]
dependencies = [
    "Pillow>=12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12"
]

[project.scripts]
cbzfit = "cbzfit.cli:main"

[project.urls]
Homepage = "https://github.com/luigibrosse/cbzfit"
Repository = "https://github.com/luigibrosse/cbzfit"
Issues = "https://github.com/luigibrosse/cbzfit/issues"

[tool.hatch.version]
path = "src/cbzfit/__init__.py"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
cache_dir = ".venv/pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py312"
